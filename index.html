<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vegan7 — Choose your language / Sprache wählen</title>
<link rel="stylesheet" href="/css/style.css?v=6">
<link rel="alternate" hreflang="de" href="https://vegan7.de/de/">
<link rel="alternate" hreflang="en" href="https://vegan7.de/en/">
<link rel="alternate" hreflang="fr" href="https://vegan7.de/fr/">
<link rel="alternate" hreflang="es" href="https://vegan7.de/es/">
<link rel="alternate" hreflang="x-default" href="https://vegan7.de/de/">
<script>
(function () {
  var SUPPORTED = ["de", "en", "fr", "es"];
  try {
    var storedLang = localStorage.getItem("vegan7_lang");
    var progressRaw = localStorage.getItem("vegan7_progress");
    var hasProgress = false;
    try {
      hasProgress = JSON.parse(progressRaw || "[]").length > 0;
    } catch (e2) {}

    if (hasProgress || storedLang) {
      var target = SUPPORTED.indexOf(storedLang) !== -1 ? storedLang : "de";
      window.location.replace("/" + target + "/");
    }
  } catch (e) {}
})();
</script>
<style>
  .lang-picker{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  .lang-picker .logo-big{ font-family:var(--font-display); font-size:2rem; font-weight:700; margin-bottom:8px; }
  .lang-picker .logo-big span{ color:var(--mint); }
  .lang-picker p{ color:var(--grey); margin-bottom:30px; }
  .lang-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; max-width:360px; width:100%; }
  .lang-grid a{
    display:block; padding:18px; border-radius:14px; text-decoration:none;
    background:var(--panel); border:1px solid rgba(255,255,255,0.08); color:var(--white);
    font-weight:600; transition:border-color .15s;
  }
  .lang-grid a:hover{ border-color:rgba(62,207,142,0.4); }
  .lang-grid .flag{ font-size:1.8rem; display:block; margin-bottom:6px; }
  #suggestion{
    display:none; margin-top:26px; padding:16px 20px; background:var(--panel);
    border:1px solid rgba(62,207,142,0.3); border-radius:12px; max-width:360px;
  }
  #suggestion p{ margin-bottom:12px; color:var(--white); font-size:0.9rem; }
  #suggestion a.cta{ display:inline-block; }
</style>
</head>
<body>

<div class="lang-picker">
  <div class="logo-big">vegan<span>7</span></div>
  <p>Choose your language · Sprache wählen · Choisis ta langue · Elige tu idioma</p>

  <div class="lang-grid">
    <a href="/de/"><span class="flag">🇩🇪</span>Deutsch</a>
    <a href="/en/"><span class="flag">🇬🇧</span>English</a>
    <a href="/fr/"><span class="flag">🇫🇷</span>Français</a>
    <a href="/es/"><span class="flag">🇪🇸</span>Español</a>
  </div>

  <div id="suggestion">
    <p id="suggestion-text"></p>
    <a id="suggestion-link" href="#" class="cta">Continue →</a>
  </div>
</div>

<script>
(function () {
  var SUPPORTED = ["de", "en", "fr", "es"];
  var MESSAGES = {
    de: { text: "Es sieht so aus, als würdest du Deutsch bevorzugen.", cta: "Weiter auf Deutsch →" },
    en: { text: "Looks like you prefer English.", cta: "Continue in English →" },
    fr: { text: "On dirait que tu préfères le français.", cta: "Continuer en français →" },
    es: { text: "Parece que prefieres el español.", cta: "Continuar en español →" }
  };

  function detectLang() {
    var langs = navigator.languages || [navigator.language || navigator.userLanguage];
    for (var i = 0; i < langs.length; i++) {
      var short = (langs[i] || "").slice(0, 2).toLowerCase();
      if (SUPPORTED.indexOf(short) !== -1) return short;
    }
    return null;
  }

  var detected = detectLang();
  if (detected) {
    var box = document.getElementById("suggestion");
    var textEl = document.getElementById("suggestion-text");
    var linkEl = document.getElementById("suggestion-link");
    textEl.textContent = MESSAGES[detected].text;
    linkEl.textContent = MESSAGES[detected].cta;
    linkEl.href = "/" + detected + "/";
    box.style.display = "block";
  }
})();
</script>

</body>
</html>
